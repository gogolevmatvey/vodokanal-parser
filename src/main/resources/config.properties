# ====================================
# Параметры подключения к базе данных
# ====================================
db.host=localhost
db.port=5433
db.name=vodokanal-db
db.user=postgres
db.password=postgres

# ====================================
# Пути к файлам
# ====================================
file.input=Testovye_dannye (1).txt
file.output.valid=valid_records.txt
file.output.invalid=invalid_records.txt
file.output.corrected=corrected_records.txt
file.output.uncorrected=uncorrected_records.txt
